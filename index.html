<!doctype html>
<html lang="en">
  <head>
    <meta name="color-scheme" content="light dark" />
    <script>
      (function () {
        var p = "studio",
          t,
          c;
        try {
          t = JSON.parse(localStorage.getItem(p + "-theme"));
        } catch (e) {}
        try {
          c = JSON.parse(localStorage.getItem(p + "-contrast"));
        } catch (e) {}
        var r = document.documentElement;
        r.dataset.theme =
          t === "light" || t === "dark"
            ? t
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        r.dataset.contrast =
          c === "standard" || c === "more"
            ? c
            : matchMedia("(prefers-contrast: more)").matches
              ? "more"
              : "standard";
        r.style.colorScheme = r.dataset.theme;
      })();
    </script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta
      name="description"
      content="Template Studio by Ignatius Seto. A responsive rich text playground built with React, TypeScript, and the MIT-licensed HugeRTE editor."
    />
    <meta name="theme-color" content="#355b46" />
    <title>Template Studio · Ignatius Seto</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
